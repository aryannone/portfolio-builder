<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>PortfolioVerse</title>
<meta name="description" content="Build, customize and export your own portfolio website. No account, no backend.">

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&display=swap">
<style>:root{--ink:#14151c;--mut:#5d6172;--bg:#e9ebf1;--pan:#fff;--line:#d9dce6;--acc:#3b3bf0;--acc2:#2a2ad0;--lime:#c8f52f;--red:#d3304a;--ok:#12805c;--warn:#a86400;--r:12px;--vvh:100dvh;--sheet-h:calc(var(--vvh)*.54);--hd:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
body.modal-open #app{filter:none}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}[hidden]{display:none!important}
.skip{position:absolute;left:-999px;z-index:999;background:var(--ink);color:#fff;padding:8px 12px}.skip:focus{left:8px;top:8px}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
#app{height:var(--vvh);overflow:hidden}
.screen{height:var(--vvh);display:flex;flex-direction:column;min-height:0}
.show-m{display:none!important}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:9px 16px;border:1.5px solid var(--line);background:var(--pan);border-radius:10px;font-weight:600;white-space:nowrap;transition:transform .12s,background .15s,border-color .15s}
.btn:hover:not(:disabled){border-color:var(--ink)}.btn:active:not(:disabled){transform:translateY(1px)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}.btn.primary:hover:not(:disabled){background:var(--acc2);border-color:var(--acc2)}
.btn.ghost{background:transparent;border-color:transparent}.btn.ghost:hover:not(:disabled){background:rgba(20,21,28,.06);border-color:transparent}
.btn.danger{background:var(--red);border-color:var(--red);color:#fff}.danger-t{color:var(--red)}
.btn.sm{min-height:36px;padding:5px 11px;font-size:13px;border-radius:9px}.btn.lg{min-height:54px;padding:13px 24px;font-size:17px;border-radius:13px}
.btn:disabled,.iconbtn:disabled,.back:disabled{opacity:.4;cursor:not-allowed}
.iconbtn{display:inline-grid;place-items:center;width:44px;height:44px;border:0;background:transparent;border-radius:10px;flex:none}.iconbtn:hover:not(:disabled){background:rgba(20,21,28,.07)}.item-a .iconbtn,.sact .iconbtn{width:36px;height:36px}
.ic{flex:none}.muted{color:var(--mut)}.sm{font-size:13px}
/* app bar */
.appbar{flex:none;display:flex;align-items:center;gap:10px;padding:8px 14px;padding-top:max(8px,env(safe-area-inset-top));background:var(--pan);border-bottom:1px solid var(--line);min-height:60px}
.back{display:inline-flex;align-items:center;gap:4px;min-height:44px;padding:0 12px 0 6px;border:1.5px solid var(--line);background:#fff;border-radius:10px;font-weight:700;flex:none}.back:hover:not(:disabled){border-color:var(--ink)}
.ab-title{flex:1;min-width:0}.ab-title h1{margin:0;font:800 19px/1.15 var(--hd);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ab-title small{color:var(--mut);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ab-right{display:flex;align-items:center;gap:6px;flex:none}
.miybtn{background:var(--lime);border-color:var(--lime);color:#111}.miybtn:hover:not(:disabled){background:#d8ff4a;border-color:#111}
.savebadge{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 10px;border:1px solid var(--line);background:#fff;border-radius:99px;font-size:12px;font-weight:600;color:var(--mut)}
.savebadge i{width:8px;height:8px;border-radius:50%;background:var(--ok)}.savebadge.unsaved i,.savebadge.saving i{background:#e0a100}.savebadge.error i{background:var(--red)}.savebadge.error{color:var(--red);border-color:var(--red)}
.stepper{flex:none;background:var(--pan);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}.stepper ol{display:flex;gap:2px;margin:0;padding:6px 12px;list-style:none;min-width:max-content}
.stepper button{display:flex;align-items:center;gap:6px;min-height:32px;padding:3px 10px 3px 4px;border:0;background:transparent;border-radius:99px;font-size:12px;font-weight:600;color:var(--mut)}.stepper button:disabled{cursor:default;opacity:.55}
.stepper button::first-line{font-weight:800}.stepper li.cur button{background:var(--ink);color:#fff}.stepper li.done button{color:var(--ink)}.stepper button:hover:not(:disabled):not([aria-current]){background:rgba(20,21,28,.07)}
.stepper button{counter-reset:x}.stepper button span{margin-left:2px}
.sbody{flex:1;overflow:auto;min-height:0;-webkit-overflow-scrolling:touch}
.inner{max-width:980px;margin:0 auto;padding:26px 20px 40px}.inner.wide{max-width:1280px}.h2{font:800 28px/1.1 var(--hd);margin:0 0 6px}
.stepbar{flex:none;display:flex;align-items:center;gap:10px;padding:10px 16px;padding-bottom:max(10px,env(safe-area-inset-bottom));background:var(--pan);border-top:1px solid var(--line)}.stepbar .si{flex:1;text-align:center;color:var(--mut);font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis}
.notice{padding:11px 14px;border-radius:10px;background:#fff;border:1px solid var(--line);margin:0 0 14px;font-size:13.5px}.notice p{margin:0 0 8px}.notice.warn{background:#fff7e3;border-color:#f0cf7a}.notice.danger{background:#ffe9ec;border-color:#f1a2ae}.notice.info{background:#eef0ff;border-color:#c5c8fb}.notice.ok{background:#e6f7ef;border-color:#9ad8bd}
/* forms */

.fld input:not([type=range]):not([type=color]):not([type=checkbox]):not([type=radio]),.fld textarea,.fld select,.socrow input,.socrow select{width:100%;min-height:44px;padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;font-size:16px}
.fld textarea{resize:vertical;line-height:1.45;min-height:84px}.fld input:focus,.fld textarea:focus,.fld select:focus{border-color:var(--acc);outline:2px solid rgba(59,59,240,.25)}

.fld input[type=range]{width:100%;height:32px;accent-color:var(--acc)}.fld.clr{grid-template-columns:1fr auto auto;align-items:center}.fld.clr input{width:44px;height:36px;padding:2px;border:1.5px solid var(--line);border-radius:8px;background:#fff}.fld.clr code{font-size:11px;color:var(--mut)}
.fld.chk{display:flex;align-items:center;gap:10px;min-height:40px}.fld.chk input,.chk.inline input{width:22px;height:22px;accent-color:var(--acc);flex:none}.chk.inline{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.fld output{font-weight:500;color:var(--mut)}.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.fgrid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.fgrid .fld:nth-child(n){min-width:0}
.fgroup{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}.fgroup h3{margin:0 0 12px;font:800 16px var(--hd)}
.socrow{display:grid;grid-template-columns:120px 1fr 44px;gap:6px;margin-bottom:8px;align-items:center}
.imgrow{display:flex;gap:12px;align-items:center}.thumb{width:68px;height:68px;border-radius:10px;border:1.5px dashed var(--line);display:grid;place-items:center;overflow:hidden;background:#f6f7fb;flex:none;color:var(--mut)}.thumb img{width:100%;height:100%;object-fit:cover}.imgbtns{display:flex;gap:6px;flex-wrap:wrap}.imgfld>input{margin-top:6px}
.sh{margin:18px 0 8px;font:800 12px var(--hd);letter-spacing:.07em;text-transform:uppercase;color:var(--mut)}
/* segments, chips, tags */
.segs{display:flex;gap:4px;flex-wrap:wrap}.seg{min-height:38px;padding:6px 12px;border:1.5px solid var(--line);background:#fff;border-radius:99px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px}.seg.on,.seg[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}.segs.two{margin:8px 0 12px}.segs.two .seg{flex:1;justify-content:center;border-radius:10px}
.tag{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 7px;border-radius:99px;vertical-align:middle}.tag.minimal{background:#e8eefc;color:#2a4aa8}.tag.maximal{background:#ffe5f0;color:#b01b63}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:8px 0}.chip2{background:#eef0ff;color:#2a2ad0;border-radius:99px;padding:3px 10px;font-size:12px;font-weight:600}
/* thumbnails */
.tf{position:relative;aspect-ratio:1280/880;overflow:hidden;background:#fff;border-radius:8px;--sc:.2}.tf iframe{position:absolute;left:0;top:0;width:1280px;height:880px;border:0;transform:scale(var(--sc));transform-origin:0 0;pointer-events:none;background:#fff}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pair .tf{border:1px solid var(--line)}
/* landing */
.landing .sbody{background:radial-gradient(900px 500px at 85% -10%,#dfe2ff 0,transparent 60%),var(--bg)}
.l-hero{max-width:1180px;margin:0 auto;padding:44px 22px 30px;display:grid;grid-template-columns:1.05fr .95fr;gap:40px;align-items:center}
.kicker{display:inline-block;background:var(--lime);padding:4px 12px;border-radius:99px;font-size:12px;font-weight:800;margin:0 0 14px}
.l-copy h2{font:800 clamp(38px,6vw,72px)/.98 var(--hd);margin:0 0 16px;letter-spacing:-.03em}.lede{font-size:18px;color:#3b3e52;max-width:46ch}.l-cta{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}.l-points{list-style:none;padding:0;margin:0;display:grid;gap:6px;color:#3b3e52}.l-points li::before{content:"→ ";color:var(--acc);font-weight:800}
.l-stage{position:relative;height:420px}.l-dev{position:absolute;border:6px solid var(--ink);border-radius:16px;overflow:hidden;box-shadow:0 30px 60px -20px rgba(20,21,50,.45);background:#fff}.l-dev.a{width:78%;right:0;top:0;transform:rotate(2deg)}.l-dev.b{width:70%;left:0;bottom:0;transform:rotate(-3deg)}
.l-sys,.l-modes{max-width:1180px;margin:0 auto;padding:20px 22px}.l-sys h3{font:800 28px var(--hd);margin:10px 0 16px}.sys-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.sys-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px}.sys-card h4{font:800 24px var(--hd);margin:14px 0 4px}.sys-card p{color:#44475c;margin:0 0 14px}
.l-modes{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding-bottom:30px}.l-modes>div{background:var(--ink);color:#e9eaf5;border-radius:14px;padding:16px}.l-modes h4{margin:0 0 6px;font:800 18px var(--hd);color:var(--lime)}.l-modes p{margin:0;font-size:14px;color:#c8cadf}.l-foot{text-align:center;color:var(--mut);padding:10px 20px 40px;font-size:13px}
/* projects / gallery */
.pgrid,.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}.pcard,.gcard{background:#fff;border:1.5px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}.pcard.cur,.gcard.sel{border-color:var(--acc);box-shadow:0 0 0 3px rgba(59,59,240,.15)}
.pcard .tf,.g-prev .tf{border-radius:0;border-bottom:1px solid var(--line)}.pc-b,.g-b{padding:14px}.pc-b h3,.g-b h3{margin:0 0 4px;font:800 17px var(--hd)}.pc-b p{margin:0 0 10px;font-size:13px}.g-b p{margin:4px 0 12px;font-size:13.5px;color:#44475c}.pc-a,.g-a{display:flex;gap:6px;flex-wrap:wrap}
.g-prev{position:relative}.fav{position:absolute;right:8px;top:8px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.92);display:grid;place-items:center;color:#8a8ea3;box-shadow:0 2px 8px rgba(0,0,0,.15)}.fav.on{color:#e6a700}.fav.on svg{fill:currentColor}
.gtools{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}.empty{text-align:center;padding:60px 20px;color:var(--mut)}.empty h3{color:var(--ink);font:800 22px var(--hd)}
.sysopts{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:18px 0 22px}.sysopt{display:block;background:#fff;border:2px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;position:relative}.sysopt.on{border-color:var(--acc);box-shadow:0 0 0 4px rgba(59,59,240,.14)}.sysopt input{position:absolute;opacity:0}.sysopt:has(input:focus-visible){outline:3px solid var(--acc);outline-offset:2px}.sysopt h3{margin:12px 0 4px;font:800 22px var(--hd)}.sysopt p{margin:0;color:#44475c;font-size:14px}
/* wizard split */
.split{display:grid;grid-template-columns:minmax(0,520px) 1fr;overflow:hidden}.pane-form{overflow:auto;padding:18px;min-height:0;background:var(--bg)}.pane-prev{min-height:0;border-left:1px solid var(--line);background:#cfd2de;position:relative}
.slist{list-style:none;margin:0;padding:0;display:grid;gap:6px}.srow{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 12px;border:1.5px solid var(--line);border-radius:12px;background:#fff}.srow.off{opacity:.6;background:#f4f5f9}.sico{width:30px;height:30px;border-radius:8px;background:#eef0ff;display:grid;place-items:center;font-size:15px;flex:none}.smain{flex:1;min-width:0;display:grid}.smain strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.smain small{font-size:12px}.sact{display:flex;gap:0;flex-wrap:nowrap}
.addgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}.addtype{display:flex;align-items:center;gap:8px;min-height:48px;padding:6px 10px;border:1.5px dashed #b9bdd0;background:#fff;border-radius:11px;text-align:left;font-size:13px;font-weight:600}.addtype:hover{border-color:var(--acc);border-style:solid}.addtype .sico{width:26px;height:26px;font-size:13px}.addtype em{margin-left:auto;font-style:normal;font-size:11px;background:var(--ink);color:#fff;border-radius:99px;padding:1px 7px}
/* preview */
.pv-wrap{position:absolute;inset:0;display:flex;flex-direction:column}.pv-stage{position:relative;flex:1;min-height:0;overflow:hidden;background:repeating-conic-gradient(#d4d7e3 0 25%,#dcdfea 0 50%) 0 0/20px 20px}
.pv-dev{position:absolute;left:50%;top:0;transform:translateX(-50%);overflow:hidden;background:#fff}.pv-dev.devframe{box-shadow:0 0 0 8px #14151c,0 18px 50px rgba(0,0,0,.35);border-radius:6px;top:10px;height:calc(100% - 20px)!important}.pv-frame{transform-origin:0 0}.pv-frame{position:relative}.pv-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:#fff}.pv-frame iframe.fresh{opacity:0}
.pv-wrap.full{position:fixed;inset:0;z-index:400;background:var(--bg)}.pv-exit{position:absolute;z-index:5;right:12px;top:12px;box-shadow:0 4px 18px rgba(0,0,0,.25)}.pv-wrap.full .pv-stage{margin-top:0}
.pv-cmp{position:absolute;inset:0;display:flex;gap:8px;padding:8px;background:#cfd2de}.cmp-col{flex:1;position:relative;overflow:hidden;background:#fff;border-radius:8px;min-width:0}.cmp-col iframe{border:0;transform-origin:0 0;display:block}.cmp-l{position:absolute;left:8px;top:8px;z-index:2;background:var(--ink);color:#fff;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px}.cmp-l.new{background:var(--acc)}
.sel-tb{position:absolute;z-index:6;display:flex;align-items:center;gap:2px;background:var(--ink);color:#fff;border-radius:11px;padding:3px;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:calc(100% - 8px);overflow-x:auto}.sel-tb button{display:grid;place-items:center;width:34px;height:34px;border:0;background:transparent;color:#fff;border-radius:8px}.sel-tb button:hover{background:rgba(255,255,255,.18)}.tb-l{font-size:11px;font-weight:700;padding:0 8px;color:var(--lime);text-transform:uppercase;letter-spacing:.05em}
.sel-tb.dock{position:absolute;left:8px;right:8px;bottom:8px;top:auto;justify-content:center;flex-wrap:wrap;transform:none}.sel-tb.dock button{width:44px;height:44px}
/* workspace */
.ws{flex:1;min-height:0;display:grid;grid-template-columns:350px minmax(0,1fr) 330px;position:relative;overflow:hidden}
.ws-panel{display:flex;flex-direction:column;background:var(--pan);border-right:1px solid var(--line);min-height:0;min-width:0}.ws-center{display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}.ws-insp{background:var(--pan);border-left:1px solid var(--line);overflow:hidden;display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;gap:2px;padding:6px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;flex:none}.tab{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:6px 11px;border:0;background:transparent;border-radius:9px;font-size:13px;font-weight:600;color:var(--mut);white-space:nowrap;position:relative}.tab.on{background:var(--ink);color:#fff}.tab:hover:not(.on){background:rgba(20,21,28,.06)}.tab .dot{width:7px;height:7px;border-radius:50%;background:#f59e0b;margin-left:3px}
.tabbody,.inspbody{flex:1;overflow:auto;padding:14px;min-height:0;-webkit-overflow-scrolling:touch}
.sheet-grab{display:none}.devbar{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 10px;background:var(--pan);border-bottom:1px solid var(--line)}.devtools{display:flex;gap:2px}.prevhost{flex:1;min-height:0;position:relative}
.acc{border:1px solid var(--line);border-radius:11px;margin:0 0 8px;background:#fff;overflow:hidden}.acc.sec.off{opacity:.65}.acc-h{display:flex;width:100%;justify-content:space-between;align-items:center;min-height:46px;padding:8px 12px;border:0;background:#f7f8fc;font-weight:700;text-align:left;gap:8px}.acc.open>.acc-h svg,.acc.open>.acc-hr svg{transform:rotate(180deg)}.acc-b{padding:12px}.acc-hr .acc-h{border-radius:0}
.acc.flash,.item.flash,.fld.flash{animation:flash 1.3s}@keyframes flash{0%,60%{box-shadow:0 0 0 3px var(--acc);background:#eef0ff}}
.item{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:#fff}.item-h{display:flex;align-items:center;gap:2px;padding:2px 4px 2px 0}.item-t{flex:1;min-width:0;display:flex;align-items:center;gap:6px;min-height:44px;padding:0 10px;border:0;background:transparent;font-weight:600;text-align:left}.item-t span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.item.open .item-t svg{transform:rotate(180deg)}.item-a{display:flex}.item-b{padding:4px 12px 4px;border-top:1px solid var(--line)}
.tplrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}.tplrow>div{display:grid}
.swatches{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.swatch{display:grid;grid-template-columns:repeat(4,12px);height:36px;border:1.5px solid var(--line);border-radius:9px;overflow:hidden;padding:0;width:56px;background:#fff}.swatch i{display:block}.swatch:hover{border-color:var(--ink)}
.miy-hero{background:linear-gradient(135deg,var(--lime),#9af0c0);border-radius:14px;padding:14px;margin-bottom:12px;color:#111}.miy-hero h3{margin:0 0 4px;font:800 19px var(--hd);display:flex;gap:6px;align-items:center}.miy-hero p{margin:0;font-size:13.5px}
.presets{display:grid;grid-template-columns:1fr 1fr;gap:8px}.preset{display:grid;gap:2px;text-align:left;padding:10px 12px;min-height:64px;border:1.5px solid var(--line);background:#fff;border-radius:11px}.preset:hover{border-color:var(--ink);background:#fbfcff}.preset strong{font-size:13.5px}.preset small{color:var(--mut);font-size:11.5px;line-height:1.3}

    onMount: (w, close) => { const inp = $('#pd-in', w); inp.select(); const fin = ok => { window.__pdv = inp.value; close(ok); }; inp.addEventListener('keydown', e => { if (e.key === 'Enter') fin('yes'); }); w.addEventListener('click', e => { const b = e.target.closest('[data-dlg="yes"]'); if (b) window.__pdv = inp.value; }, true); } }).then(v => res(v === 'yes' ? window.__pdv : null)); });
}

/* ----- form fields: every control is bound to a model path via data-bind ----- */
function fld(f, value, path, o = {}) {
  const id = 'f-' + slug(path), attr = `data-bind="${esc(path)}" id="${id}"`, lab = esc(f.l);
  const wrapA = `class="fld" data-fld="${esc(path)}"`;
  switch (f.t) {
    case 'textarea': return `<label ${wrapA}><span>${lab}</span><textarea ${attr} rows="${f.rows || 3}" data-t="str">${esc(value || '')}</textarea></label>`;
    case 'range': return `<label ${wrapA}><span>${lab} <output>${+value || 0}</output></span><input type="range" min="0" max="100" ${attr} data-t="num" value="${+value || 0}"></label>`;
    case 'tags': return `<label ${wrapA}><span>${lab}</span><input ${attr} data-t="tags" value="${esc((value || []).join(', '))}"></label>`;
    case 'url': { const bad = value && cleanUrl(value) === null; return `<label ${wrapA}><span>${lab}</span><input ${attr} data-t="url" inputmode="url" autocapitalize="off" autocomplete="off" placeholder="https://…" value="${esc(value || '')}" ${bad ? 'aria-invalid="true"' : ''} aria-describedby="${id}-err"><em class="err" id="${id}-err" role="alert" ${bad ? '' : 'hidden'}>This link can’t be used. Start with https:// (or mailto: / tel: / #section). Unsafe links like javascript: are blocked and will be left out of your site.</em></label>`; }
    case 'email': return `<label ${wrapA}><span>${lab}</span><input ${attr} type="email" data-t="str" inputmode="email" autocapitalize="off" value="${esc(value || '')}" ${value && !isEmail(value) ? 'aria-invalid="true"' : ''} aria-describedby="${id}-err"><em class="err" id="${id}-err" role="alert" ${value && !isEmail(value) ? '' : 'hidden'}>That doesn’t look like an email address (for example name@example.com).</em></label>`;
    case 'image': case 'file': return imageField(f, value, path);
    default: return `<label ${wrapA}><span>${lab}</span><input ${attr} data-t="str" value="${esc(value || '')}" autocomplete="off"></label>`;
  }
}
function imageField(f, value, path) {
  const v = String(value || ''), isAsset = /^asset:/.test(v), a = isAsset && S.project.assets[v.slice(6)], isPdf = f.t === 'file';
  const thumb = a && /^image/.test(a.mime) ? `<img src="${a.dataUrl}" alt="">` : (v && !isPdf && cleanUrl(v) ? `<img src="${esc(cleanUrl(v))}" alt="" onerror="this.style.opacity=.2">` : `<span>${ico(isPdf ? 'file' : 'image', 22)}</span>`);
  const bad = v && !isAsset && cleanUrl(v) === null;
  return `<div class="fld imgfld" data-fld="${esc(path)}"><span>${esc(f.l)}</span><div class="imgrow"><div class="thumb">${thumb}</div><div class="imgbtns"><button class="btn sm" data-act="upload" data-path="${esc(path)}" data-pdf="${isPdf ? 1 : 0}">${ico('upload', 16)} ${isAsset ? 'Replace' : 'Upload'}</button>${v ? `<button class="btn sm ghost" data-act="clearimg" data-path="${esc(path)}">Remove</button>` : ''}</div></div>${isAsset ? `<small class="muted">${esc(a ? a.name : 'missing file')} · ${a ? fmtBytes(a.size) : ''} · embedded in your site</small>` : `<input data-bind="${esc(path)}" data-t="url" inputmode="url" autocapitalize="off" placeholder="…or paste a link (https://)" aria-label="${esc(f.l)} — link" value="${esc(v)}" ${bad ? 'aria-invalid="true"' : ''}><em class="err" role="alert" ${bad ? '' : 'hidden'}>This link can’t be used. Start with https://.</em>${v && !bad ? '<small class="muted">Linked images need the internet and must stay online.</small>' : ''}`}</div>`;
}
const sel = (label, path, val, opts, o = {}) => `<label class="fld" data-fld="${esc(path)}"><span>${label}</span><select data-bind="${path}" data-t="${o.t || 'str'}">${opts.map(x => { const [v, l] = Array.isArray(x) ? x : [x, x]; return `<option value="${esc(v)}"${String(v) === String(val) ? ' selected' : ''}>${esc(l)}</option>`; }).join('')}</select></label>`;
const rng = (label, path, val, min, max, step = 1, unit = '') => `<label class="fld" data-fld="${esc(path)}"><span>${label} <output>${esc(val)}${unit}</output></span><input type="range" data-bind="${path}" data-t="num" data-unit="${unit}" min="${min}" max="${max}" step="${step}" value="${esc(val)}"></label>`;
const clr = (label, path, val) => `<label class="fld clr" data-fld="${esc(path)}"><span>${label}</span><input type="color" data-bind="${path}" data-t="str" value="${hexOk(val) ? val : '#000000'}"><code>${esc(val)}</code></label>`;
const chk = (label, path, val) => `<label class="fld chk" data-fld="${esc(path)}"><input type="checkbox" data-bind="${path}" data-t="bool" ${val ? 'checked' : ''}><span>${label}</span></label>`;
const fontOpts = () => Object.keys(FONTS).map(n => [n, n + (FONTS[n].local ? ' (no download)' : '')]);

/* ----- persistent banner: save failures, edit conflicts and session-only storage must never be missable ----- */
function bannerSpec() {
  if (S.conflict) return { kind: 'danger', role: 'alert', msg: 'This portfolio was changed in another tab or window. Autosave is paused so nothing gets overwritten.', acts: [['bannerload', 'Load the latest version', 'btn sm primary'], ['bannermine', 'Keep my version', 'btn sm'], ['backup', 'Download my copy', 'btn sm ghost']] };
  if (S.saveState === 'error') return { kind: 'danger', role: 'alert', msg: 'Couldn’t save to this browser (' + (S.saveError || 'unknown error') + '). Your work is still on screen but is not stored — storage may be full or blocked.', acts: [['retrysave', 'Try again', 'btn sm primary'], ['backup', 'Download backup (JSON)', 'btn sm']] };
  if (S.project && DB.mode === 'memory') return { kind: 'warn', role: 'status', msg: 'Saving is blocked here, so your work lasts only while this page stays open.', acts: [['backup', 'Download backup (JSON)', 'btn sm primary']] };
  return null;
}
function renderBanner() {
  const el = $('#banner'); if (!el) return; const b = bannerSpec(), key = b ? b.msg + b.acts.length : '';
  if (el.dataset.key === key) return; el.dataset.key = key;
  if (!b) { el.hidden = true; el.innerHTML = ''; el.removeAttribute('role'); return; }
  el.hidden = false; el.className = 'banner ' + b.kind; el.setAttribute('role', b.role);
  el.innerHTML = `<p>${esc(b.msg)}</p><div class="ba">${b.acts.map(([a, l, c]) => `<button class="${c}" data-act="${a}">${esc(l)}</button>`).join('')}</div>`;
}
/* polite, de-duplicated announcement of save progress for screen readers */
let _lastSaidState = '';
function announceState() { const r = $('#sr-status'); if (!r) return; const say = { saved: 'All changes saved', conflict: '', error: '' }[S.saveState]; if (say && _lastSaidState !== S.saveState) { clearTimeout(announceState.t); announceState.t = setTimeout(() => { r.textContent = ''; setTimeout(() => r.textContent = say, 30); }, 900); } _lastSaidState = S.saveState; }

const ThumbDocs = new Map();
function thumbDoc(tpl, proj) {
  const key = tpl + ':' + (proj ? proj.id + ':' + proj.updatedAt : 'sample'); if (ThumbDocs.has(key)) return ThumbDocs.get(key);
  let p; if (proj) { p = { ...proj, design: makeDesign(tpl), code: { html: null, css: null, js: null } }; } else p = newProject({ system: TEMPLATES[tpl].system, template: tpl });
  const d = assembleDocument(p, { mode: 'thumb', fonts: true }); ThumbDocs.size > 40 && ThumbDocs.clear(); ThumbDocs.set(key, d); return d;
}
const tf = (tpl, proj, extra = '') => `<div class="tf" data-tpl="${tpl}" ${proj ? `data-proj="${proj}"` : ''} ${extra}><iframe sandbox title="${esc(TEMPLATES[tpl].name)} preview" tabindex="-1" aria-hidden="true"></iframe></div>`;
const projectThumb = p => `<div class="tf" data-own="${p.id}"><iframe sandbox title="Preview of ${esc(p.name)}" tabindex="-1" aria-hidden="true"></iframe></div>`;
let _thumbObs;
function hydrateThumbs(root) {
  const ro = new ResizeObserver(es => es.forEach(e => e.target.style.setProperty('--sc', (e.contentRect.width / 1280).toFixed(4))));
  _thumbObs && _thumbObs.disconnect();
  const io = new IntersectionObserver(es => es.forEach(e => { if (!e.isIntersecting) return; const el = e.target, f = $('iframe', el); io.unobserve(el);
    if (el.dataset.own) { const p = S._cache.get(el.dataset.own) || S.project; f.srcdoc = assembleDocument(p, { mode: 'thumb' }); } else f.srcdoc = thumbDoc(el.dataset.tpl, el.dataset.proj && S.project ? S.project : null); }), { rootMargin: '200px' });
  $$('.tf', root).forEach(el => { ro.observe(el); io.observe(el); }); _thumbObs = { disconnect() { ro.disconnect(); io.disconnect(); } };
}

/* ===== 09-preview: sandboxed live preview + click-to-edit bridge host ===== */
const Preview = { inst: null };
const DEV = { desktop: 1280, tablet: 820, mobile: 390 };
const KIND_LABEL = { text: 'Text', button: 'Button', card: 'Card', section: 'Section', image: 'Image', link: 'Link', nav: 'Navigation' };

function mountPreview(host, { interactive = true } = {}) {
  destroyPreview();
  host.innerHTML = `<div class="pv-wrap ${interactive ? 'int' : ''}"><div class="pv-stage"><div class="pv-dev"><div class="pv-frame"><iframe sandbox="allow-scripts" title="Live portfolio preview"></iframe></div></div><div class="pv-cmp" hidden></div><div class="sel-tb" hidden role="toolbar" aria-label="Selected element tools"></div></div></div>`;

  Preview.inst = inst; inst.ro = new ResizeObserver(() => layoutPreview()); inst.ro.observe(stage);
  refreshPreview(true); return inst;
}
function destroyPreview() { const i = Preview.inst; if (!i) return; i.ro.disconnect(); clearTimeout(i.timer); Preview.inst = null; }

/* Re-assigning srcdoc on an existing iframe adds a session-history entry (it would hijack the browser Back button).
   Inserting a brand-new iframe does not, so we double-buffer: build the new frame, then drop the old one once it has loaded. */
function swapFrame(j, doc) {
  const old = j.frame, nf = document.createElement('iframe'); nf.setAttribute('sandbox', 'allow-scripts'); nf.title = 'Live portfolio preview'; nf.className = 'fresh';
  nf.srcdoc = doc; j.frame = nf; let fin = false, t;
  const done = () => { if (fin) return; fin = true; clearTimeout(t); if (j.frame !== nf) { nf.remove(); old.remove(); return; } nf.classList.remove('fresh'); old.remove(); $$('iframe', j.fr).forEach(f => f !== nf && f.remove()); };
  nf.addEventListener('load', done, { once: true }); t = setTimeout(done, 4000); j.fr.appendChild(nf);
}
function layoutPreview() {
  const i = Preview.inst; if (!i) return; const sw = i.stage.clientWidth, sh = i.stage.clientHeight; if (!sw || !sh) return;
  if (S.ui.fullscreen && i.wrap.classList.contains('full') === false) i.wrap.classList.add('full');
  let dw = DEV[S.ui.device] || 1280, scale = 1;
  if (S.ui.device === 'mobile' && sw <= 520) dw = sw; else scale = Math.min(1, (sw - 16) / dw);
  i.scale = scale; i.dev.style.width = dw * scale + 'px'; i.dev.style.height = sh + 'px';
  i.fr.style.width = dw + 'px'; i.fr.style.height = sh / scale + 'px'; i.fr.style.transform = `scale(${scale})`;
  i.dev.classList.toggle('devframe', S.ui.device !== 'desktop' && sw > 520);

}
function layoutCompare() {
  const i = Preview.inst, c = $('.pv-cmp', i.host); if (!c || c.hidden) return;
  $$('.cmp-col', c).forEach(col => { const w = col.clientWidth, f = $('iframe', col); const k = w / 1280; f.style.width = '1280px'; f.style.height = (col.clientHeight / k) + 'px'; f.style.transform = `scale(${k})`; });
}
function previewDoc(proj, o = {}) { const code = o.interactive ? previewCode(proj, o.animate) : effectiveCode(proj); return assembleDocument(proj, { mode: o.interactive ? 'preview' : 'export', embedded: true, code, animate: o.animate, scroll: o.scroll, selected: o.selected }); }

function refreshPreview(immediate) {
  const i = Preview.inst; if (!i) return; clearTimeout(i.timer);
  const run = () => {
    const j = Preview.inst; if (!j) return; const pp = previewProject(); if (!pp) return;
    const animKey = JSON.stringify(pp.design.anim) + pp.design.template + (S.activeVar || '');
    const animate = !!(j.forceAnim || animKey !== j.animKey || !j.loaded); j.animKey = animKey; j.forceAnim = false; j.loaded = true;
    const cmp = $('.pv-cmp', j.host), compare = S.compare && S.activeVar;
    j.dev.hidden = !!compare; cmp.hidden = !compare; if (!compare) cmp.innerHTML = ''; if (compare) j.wrap.classList.add('comparing'); else j.wrap.classList.remove('comparing');
    if (compare) {

      cmp.innerHTML = `<div class="cmp-col"><span class="cmp-l">Current</span><iframe sandbox="allow-scripts" title="Current design" srcdoc="${esc(previewDoc(cur, {}))}"></iframe></div><div class="cmp-col"><span class="cmp-l new">${esc(v.label)}</span><iframe sandbox="allow-scripts" title="Variation" srcdoc="${esc(previewDoc({ ...cur, design: v.design }, {}))}"></iframe></div>`; layoutCompare(); hideToolbar(); return;
    }

function positionToolbar(rect) {
  const i = Preview.inst; if (!i) return; const tb = $('.sel-tb', i.host); if (!tb) return; if (rect) i.rect = rect;
  if (!S.ui.selected || !i.interactive || (S.compare && S.activeVar)) { tb.hidden = true; return; }
  if (!tb.dataset.sig || tb.dataset.sig !== S.ui.selected + S.ui.selKind) { tb.innerHTML = toolbarHTML(); tb.dataset.sig = S.ui.selected + S.ui.selKind; }

window.addEventListener('message', e => {
  /* a click on a real link inside any of our preview frames: nothing navigates in a preview, so say why */
  /* Escape pressed while focus is inside a preview frame: forward it so dialogs / full screen still close */
  if (e.data && e.data.pv && e.data.t === 'esc' && [...document.querySelectorAll('iframe')].some(f => f.contentWindow === e.source)) { document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true, cancelable: true })); return; }
  if (e.data && e.data.pv && e.data.t === 'link' && typeof e.data.href === 'string' && [...document.querySelectorAll('iframe')].some(f => f.contentWindow === e.source)) { toast('Links are switched off in the preview — ' + e.data.href.replace(/^https?:\/\//, '').slice(0, 40) + ' will work on your published site.', 'warn'); return; }
  const i = Preview.inst, m = e.data; if (!i || !m || !m.pv) return;
  if (e.source === i.frame.contentWindow && i.interactive) {
    switch (m.t) {
      case 'select': { const KINDS = ['text', 'button', 'card', 'section', 'image', 'link', 'nav'], path = typeof m.path === 'string' && /^[\w\/-]{1,120}$/.test(m.path) ? m.path : null;
        if (path) selectPath(path, KINDS.includes(m.kind) ? m.kind : 'text', typeof m.link === 'string' ? m.link.slice(0, 300) : '', { fromPreview: true }); else selectPath(null); break; }
      case 'rect': if (m.rect && ['x', 'y', 'w', 'h'].every(k => isFinite(+m.rect[k]))) positionToolbar({ x: +m.rect.x, y: +m.rect.y, w: +m.rect.w, h: +m.rect.h }); break;
      case 'scroll': i.scroll = snum(m.y, 0, 0, 1e7); break;
      case 'ready': if (S.ui.selected) postPreview({ t: 'select', path: S.ui.selected }); emit('previewready'); break;
      case 'edit': {
        /* The preview frame runs user-written JS, so its messages are untrusted input: only real text fields may be edited, as plain strings. */
        if (effectiveCode(S.project).manual.html) { toast('HTML is manually edited — restore the generated HTML in the Code editor to use click-to-edit.', 'warn'); refreshPreview(true); break; }
        if (typeof m.value !== 'string' || m.value.length > 20000 || !inlineEditable(S.project, m.path)) break;
        editPath(m.path, m.value); emit('selection', { path: m.path }); break;
      }
      case 'error': emit('runtimeerror', { msg: sstr(m.msg, 300), line: snum(m.line, 0, 0, 1e7) }); break;
    }
  } else if (m.t === 'error') emit('runtimeerror', { msg: sstr(m.msg, 300), line: snum(m.line, 0, 0, 1e7) });
